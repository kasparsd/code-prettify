name: Test

on:
  # Restrict push triggers to trunk so pull request branches (which also
  # trigger `pull_request` below) don't run the jobs twice.
  push:
    branches:
      - master
  pull_request:

jobs:

  lint:
    name: Lint and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Install NPM dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      # Sanity check: the release packaging must work from the repo root.
      # Unsigned on purpose: test.yml runs on every push to any branch, and
      # only genuine releases (maintainer-triggered, in deploy.yml) may
      # consume the production signing key.
      - name: Zip
        run: npm run zip -- --no-embed-checksums --no-sign-checksums

  # A pull request that changed the package needs a changeset, either with
  # a release note or an empty one for an explicit no-release decision.
  changeset:
    name: Check the changeset
    # Automated release PRs (branches starting with `release/`) consume
    # their pending changesets by design, so a newly added changeset can
    # never satisfy the gate.
    if: github.event_name == 'pull_request' && ! startsWith( github.head_ref, 'release/' )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The comparison needs the base branch history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm install

      - name: Changeset status
        run: npx wp-release changeset-status --since "origin/${{ github.base_ref }}"
