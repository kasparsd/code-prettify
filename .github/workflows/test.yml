name: Test

on:
  push:

jobs:

  lint:
    name: Lint and Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Install NPM dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      # Sanity check: the full release packaging (embedded and signed
      # checksums manifest, per the wp-release config) must work from the
      # repo root.
      - name: Zip
        env:
          WP_RELEASE_SIGNING_KEY: ${{ secrets.WP_RELEASE_SIGNING_KEY }}
        run: npm run zip

  # A pull request that changed the package needs a changeset, either with
  # a release note or an empty one for an explicit no-release decision.
  changeset:
    name: Check the changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The comparison needs the base branch history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm install

      - name: Changeset status
        run: npx wp-release changeset-status --since "origin/${{ github.base_ref }}"
