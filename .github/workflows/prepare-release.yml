name: Prepare Release

# Consumes pending changesets on master and opens or updates a release pull
# request with the version bumps and changelog entries.
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare:
    name: Open or update the release pull request
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm ci

      # Applies the pending changesets to the version files (plugin header,
      # readme Stable tag, composer.json) and CHANGELOG.md, and removes the
      # consumed changeset files.
      - name: Version the pending changesets
        id: version
        run: npx wp-release changeset-version --github-output

      - name: Create or update the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.version.outputs.result }}
        run: |
          VERSION=$(node -e "
            const r = JSON.parse( process.env.RESULT || '{}' );
            const release = r.releases && r.releases[ 0 ];
            process.stdout.write( release ? release.nextVersion : '' );
          ")
          if [ -z "$VERSION" ]; then
            echo "No pending releases, nothing to do."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          BRANCH="release/$VERSION"
          git switch --force-create "$BRANCH"
          git add --all
          git commit --message "Release $VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          TITLE="Release $VERSION"
          BODY="Automated release pull request for $VERSION, generated from the pending [changesets](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/master/.changeset). Merging creates the release tag and the GitHub release."
          # Update the PR when it already exists; the force-pushed branch
          # updates its content either way.
          if gh pr view "$BRANCH" --json number > /dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base master --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
