name: Prepare Release

# Consumes pending changesets on master and opens or updates a release pull
# request with the version bumps and changelog entries.
on:
  push:
    branches:
      - master
    paths:
      # Only run when a changeset is added (or removed), or when the release
      # configuration changes, instead of on every master push.
      - '.changeset/**'
      - 'wp-release.config.mjs'
      - '.github/workflows/prepare-release.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  version:
    name: Open or update the release pull request
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm ci

      # Applies the pending changesets to the version files (plugin header,
      # readme Stable tag, composer.json) and CHANGELOG.md, and removes the
      # consumed changeset files. With no pending releases, it leaves the
      # working tree alone.
      - name: Version the pending changesets
        id: version
        run: npx wp-release changeset-version --github-output

      # Resolves the release version from the changeset-version result. On
      # a push without pending releases, like the merge of a release pull
      # request, this is empty and the pull request step below is skipped,
      # because create-pull-request would otherwise try to create a branch
      # named "release/".
      - name: Resolve the release version
        id: release
        env:
          RESULT: ${{ steps.version.outputs.result }}
        run: |
          VERSION=$(node -e "
            const r = JSON.parse( process.env.RESULT || '{}' );
            process.stdout.write( ( r.releases && r.releases[ 0 ] && r.releases[ 0 ].nextVersion ) || '' );
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Commits the versioned files to the release branch and opens the
      # pull request, or updates the existing release pull request when one
      # is already open; puts the branch away when it's merged. Skipped
      # when no release is pending.
      - name: Open or update the release pull request
        if: steps.release.outputs.version != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/${{ steps.release.outputs.version }}
          delete-branch: true
          commit-message: 'Release ${{ steps.release.outputs.version }}'
          title: 'Release ${{ steps.release.outputs.version }}'
          body: |
            ${{ fromJSON(steps.version.outputs.result).releases[0].changelog }}

            ---

            Automated release pull request generated from the pending [changesets](https://github.com/kasparsd/code-prettify/tree/master/.changeset). Merging it creates the release tag, the GitHub release, and the WordPress.org deployment.
