name: Tag Release

# Creates the release tag for packages that changed in the release pull
# request merge, opens the GitHub release with the notes from the
# changesets, and invokes the WordPress.org deploy directly — GitHub does
# not deliver the "release: published" event for releases created with
# the default GITHUB_TOKEN, so deploy.yml is called here.
on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: true

jobs:

  tag:
    name: Tag the release and create the GitHub release
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.tag.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Full history and all tags: wp-release reads the existing release
        # tags for its only-when-absent checks (our shallow checkout once
        # believed tag 1.5.1 was missing and Git rejected its re-creation),
        # and for the previousTag of the release notes.
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm ci

      # Pushes the <version> tag when this push released a package, like
      # the merge of a release pull request. Tags are only created when
      # absent, and the current release tag already exists on any push
      # without a version bump, so regular master pushes no-op here.
      - name: Tag the release
        id: tag
        run: npx wp-release changeset-tag --since HEAD^1 --push --github-output

      # The tag result lists each tag with its notes and pre-release flag;
      # GitHub reads them straight out of the JSON with fromJSON().
      # fromJSON() would fail on an empty output of a skipped step, but the
      # tag step above always runs and emits at least an empty tags list.
      # The default GITHUB_TOKEN can create the release: the deploy below
      # is invoked directly, so no release event has to fire from it.
      - name: Create the GitHub release
        if: fromJSON(steps.tag.outputs.result).tags[0] != null
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ fromJSON(steps.tag.outputs.result).tags[0].tag }}
          TITLE: ${{ fromJSON(steps.tag.outputs.result).tags[0].title }}
          NOTES: ${{ fromJSON(steps.tag.outputs.result).tags[0].notes }}
          PRERELEASE: ${{ fromJSON(steps.tag.outputs.result).tags[0].prerelease }}
        run: |
          ARGS=( "$TAG" --title "$TITLE" --notes "$NOTES" )
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=( --prerelease )
          fi
          gh release create "${ARGS[@]}"

  # Deploys the release and attaches the ZIP to the release created above.
  # Called directly, because the release event would not fire for a release
  # created with the default GITHUB_TOKEN.
  deploy:
    name: Deploy the release
    needs: tag
    if: fromJSON(needs.tag.outputs.result).tags[0] != null
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ fromJSON(needs.tag.outputs.result).tags[0].tag }}
      prerelease: ${{ fromJSON(needs.tag.outputs.result).tags[0].prerelease }}
    secrets: inherit
