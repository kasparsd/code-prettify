name: Tag Release

# Creates the release tag for packages that changed in the release pull
# request merge, and opens the GitHub release with the notes from the
# changesets. The release event then triggers the WordPress.org deploy.
on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: true

jobs:
  tag:
    name: Tag the release and create the GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Needs the first parent of the merge commit for the changed-package
        # comparison.
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install NPM dependencies
        run: npm ci

      # Pushes the <version> tag (and reports it in the repo-wide tag
      # format) when this push changed a package with a pending release.
      # Tags are only created when absent, so reruns are safe.
      - name: Tag the release
        id: tag
        run: npx wp-release changeset-tag --since HEAD^1 --push --github-output

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.tag.outputs.result }}
        run: |
          read -r TAG TITLE NOTES PRERELEASE < <(node -e "
            const r = JSON.parse( process.env.RESULT || '{\"tags\":[]}' );
            const t = r.tags && r.tags[ 0 ];
            if ( ! t ) { process.exit( 0 ); }
            console.log(
              [ t.tag, t.title, t.notes, t.prerelease ]
                .map( ( v ) => String( v ).replace( /\n/g, '|EOL|' ) )
                .join( ' ' )
            );
          ")
          if [ -z "$TAG" ]; then
            echo "No release tags to publish."
            exit 0
          fi
          ARGS=( "$TAG" --title "${TITLE//|EOL|/ }" --notes "${NOTES//|EOL|/$'\n'}" )
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=( --prerelease )
          fi
          gh release create "${ARGS[@]}"
