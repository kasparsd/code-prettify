name: Deploy

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: write

jobs:

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-24.04
    concurrency:
      group: wporg-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      # GitHub's Ubuntu runners don't include the svn client that
      # wp-release needs to deploy.
      - name: Install Subversion
        run: |
          if command -v svn >/dev/null 2>&1; then
            echo "Subversion is already installed."
          else
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet --no-install-recommends subversion
          fi

      - name: Install NPM dependencies
        run: npm ci

      - name: Build the plugin
        run: npm run build

      # Stable releases: sync the build to trunk, copy it to tags/<version>
      # and update the assets.
      - name: Deploy stable release to WordPress.org
        if: github.event_name == 'release' && ! github.event.release.prerelease
        env:
          SVN_USERNAME: ${{ secrets.DEPLOY_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.DEPLOY_SVN_PASSWORD }}
        run: npx wp-release deploy-svn dist --slug code-prettify --trunk --svn-tag ${{ github.ref_name }} --assets-dir assets/wporg

      # Pre-releases: build tags/<version> from the source files and leave
      # trunk alone. A leading "v" in the tag name is stripped.
      - name: Deploy pre-release to WordPress.org
        if: github.event_name == 'release' && github.event.release.prerelease
        env:
          SVN_USERNAME: ${{ secrets.DEPLOY_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.DEPLOY_SVN_PASSWORD }}
        run: npx wp-release deploy-svn dist --slug code-prettify --svn-tag ${{ github.ref_name }}

      # Master pushes: update the wp.org readme without tagging.
      - name: Update the WordPress.org readme
        if: github.event_name == 'push'
        env:
          SVN_USERNAME: ${{ secrets.DEPLOY_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.DEPLOY_SVN_PASSWORD }}
        run: npx wp-release deploy-svn dist --slug code-prettify --readme-only
