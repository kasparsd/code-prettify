name: Deploy

# Deploys the plugin to WordPress.org.
#
# `push` (master) updates the readme between releases. `release`
# (published) packages, signs, deploys a release, and attaches the
# artifacts to it. `workflow_call` lets tag-release.yml invoke it directly
# for releases it creates itself, since GitHub does not deliver the
# "release: published" event for releases created with the default
# GITHUB_TOKEN.

on:
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to deploy, like 1.5.3 (release event deploys github.ref_name)'
        required: true
        type: string
      prerelease:
        description: 'Deploy to the tag only, leaving trunk and the stable tag alone'
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-24.04
    concurrency:
      group: wporg-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      # GitHub's Ubuntu runners don't include the svn client that
      # wp-release needs to deploy.
      - name: Install Subversion
        run: |
          if command -v svn >/dev/null 2>&1; then
            echo "Subversion is already installed."
          else
            sudo apt-get update --quiet
            sudo apt-get install --yes --quiet --no-install-recommends subversion
          fi

      - name: Install NPM dependencies
        run: npm ci

      # One command: archive the repo (selection driven by .distignore)
      # with the checksums manifest (WordPress.org plugin-checksums API
      # format) and its signature embedded at the package root — so the
      # wp.org build and the release ZIP both ship the pair — and sign the
      # ZIP itself. The manifest name, embedding and signing formats come
      # from the `integrity` settings of wp-release.config.mjs. The signing
      # key comes from the WP_RELEASE_SIGNING_KEY secret; collect the
      # matching public key once with `npx wp-release keygen`.
      - name: Package the release with checksums and a signature
        if: inputs.tag != '' || github.event_name == 'release'
        env:
          WP_RELEASE_SIGNING_KEY: ${{ secrets.WP_RELEASE_SIGNING_KEY }}
        run: npx wp-release zip --slug code-prettify --sign --force

      # Attach the signed ZIP to the GitHub release (pre-releases
      # included). The checksums manifest and its signature are embedded in
      # the ZIP itself and authenticate against the public key that lives
      # in the readme, so no extra assets are needed.
      - name: Attach release artifacts
        if: inputs.tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag || github.ref_name }}" code-prettify.*.zip code-prettify.*.zip.sig --clobber

      # Stable releases: deploy exactly the files of the release ZIP to
      # trunk/, copy them to tags/<version>, and update the assets.
      - name: Deploy stable release to WordPress.org
        if: ( inputs.tag != '' && ! inputs.prerelease ) || ( github.event_name == 'release' && ! github.event.release.prerelease )
        env:
          SVN_USERNAME: ${{ secrets.DEPLOY_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.DEPLOY_SVN_PASSWORD }}
        run: npx wp-release deploy-svn --from-zip code-prettify.*.zip --slug code-prettify --trunk --svn-tag ${{ inputs.tag || github.ref_name }} --assets-dir assets/wporg

      # Pre-releases: build tags/<version> from the release ZIP and leave
      # trunk alone. A leading "v" in the tag name is stripped.
      - name: Deploy pre-release to WordPress.org
        if: ( inputs.tag != '' && inputs.prerelease ) || ( github.event_name == 'release' && github.event.release.prerelease )
        env:
          SVN_USERNAME: ${{ secrets.DEPLOY_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.DEPLOY_SVN_PASSWORD }}
        run: npx wp-release deploy-svn --from-zip code-prettify.*.zip --slug code-prettify --svn-tag ${{ inputs.tag || github.ref_name }}

      # Master pushes: update the wp.org readme without tagging.
      - name: Update the WordPress.org readme
        if: github.event_name == 'push'
        env:
          SVN_USERNAME: ${{ secrets.DEPLOY_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.DEPLOY_SVN_PASSWORD }}
        run: npx wp-release deploy-svn . --slug code-prettify --readme-only
